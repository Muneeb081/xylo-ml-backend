# render.yaml — Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-reference
#
# Deploy without Docker — Render's native Python runtime handles everything.
# Push this file to GitHub, connect the repo on Render, and it auto-deploys.

services:
  # ── Web Service (FastAPI Inference API) ─────────────────────────────────────
  - type: web
    name: precon-energy-api
    runtime: python
    region: oregon          # choose: oregon | frankfurt | singapore | ohio
    plan: starter           # free | starter | standard | pro
    rootDir: .              # project root (where requirements.txt lives)

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    # Health check — Render pings this to confirm service is alive
    healthCheckPath: /health

    # Environment variables — set secret values in Render Dashboard, not here
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      # ── Firebase credentials (set actual values in Render Dashboard) ──────
      - key: FIREBASE_DATABASE_URL
        value: ""           # e.g. https://your-project-default-rtdb.firebaseio.com

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""           # Paste full JSON content of serviceAccountKey.json

      # ── Models directory (use Render Persistent Disk path if attached) ────
      - key: MODELS_DIR
        value: ""           # Leave blank to use default ./models relative path

  # ── Cron Job (Monthly report on 1st of each month at 2:00 AM UTC) ───────
  - type: cron
    name: precon-monthly-reports
    runtime: python
    region: oregon
    plan: free
    rootDir: .

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
